<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .trail {
            position: absolute;
            height: 6px;
            width: 6px;
            border-radius: 3px;
            background: teal;
        }

        body {
            height: 300px;
        }
    </style>

    <script>
        window.addEventListener("mousemove", event => {
            let dot = document.createElement("div");
            dot.className = "trail";
            dot.style.left = (event.pageX - 400) + "px";
            dot.style.top = (event.pageY - 400) + "px";
            document.body.appendChild(dot);
        });
    </script>
</body>

</html>
