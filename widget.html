<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 2rem auto;
        }

        section {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-top: 0.5rem;
        }

        button {
            margin-top: 1rem;
        }

        .output {
            margin-top: 1rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>The Best Most Coolest Widget Ever</h1>

    <section id="main">
        <h2>Background Color Picker</h2>
        <label>
            Choose Color:
            <input id="colorInput" type="color" value="#2130ff">
        </label>
        <h2>Customize Text</h2>
        <label>
            Text Size:
            <input id="sizeInput" type="range" min="0" max="60" value="16">
        </label>
        <label>
            Boldness:
            <input id="boldInput" type="range" min="100" max="900" value="500" step="100">
        </label>
    </section>
    <a href="index.html">Return Home</a>

    <script>
        // --- PART 2 ---
        const colorInput = document.getElementById("colorInput");
        const sizeInput = document.getElementById("sizeInput");
        const boldInput = document.getElementById("boldInput");
        // TODO: Update the background color of colorOutput whenever the color input changes.
        // Challenge: Also display the hex code and volume value dynamically.

        function updateColorAndVolumeDisplay() {
            const hexCode = colorInput.value;
            const textsize = sizeInput.value;
            const boldtext = boldInput.value;
            document.body.style.backgroundColor = hexCode;
            document.body.style.fontSize = textsize + "px";
            document.body.style.fontWeight = boldtext;
        }
        colorInput.addEventListener("input", updateColorAndVolumeDisplay)
        sizeInput.addEventListener("input", updateColorAndVolumeDisplay)
        boldInput.addEventListener("input", updateColorAndVolumeDisplay)
    </script>
</body>

</html>
